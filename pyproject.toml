[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lte-quasibayes"
dynamic = ["version"]
description = "Laplace-type (quasi-Bayesian) estimation via GPU-aware ensemble MCMC (Chernozhukov-Hong 2003)."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sami Abdurahman" }]
keywords = ["Laplace-type estimator", "quasi-Bayesian", "MCMC", "GMM",
            "quantile regression", "econometrics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "torch>=2.0",
    "numpy>=1.21",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.5"]
mode = ["scipy>=1.7"]
dev = ["pytest>=7.0", "matplotlib>=3.5", "scipy>=1.7"]

[project.urls]
Homepage = "https://www.sabdurahman.com/"
Repository = "https://github.com/samiabd8/CH2003_LTE"
Issues = "https://github.com/samiabd8/CH2003_LTE/issues"

[tool.setuptools.dynamic]
version = { attr = "lte.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
